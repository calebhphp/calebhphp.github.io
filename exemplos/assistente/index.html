<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Clínica Sorriso Leve – exemplo de assistente virtual | Matheus Villanova</title>
<meta name="description" content="Exemplo fictício de chatbot que tira dúvidas e marca consulta sozinho.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b141a">
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="../demo.css">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:#0b141a;color:#e9edef;font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.app{flex:1;display:flex;flex-direction:column;width:min(720px,100%);margin:0 auto;min-height:0}
.head{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#1f2c34}
.head i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:20px;background:linear-gradient(135deg,#22d3ee,#6d5cff)}
.head b{display:block}
.head small{color:#8696a0}
.log{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.msg{max-width:82%;padding:9px 12px 6px;border-radius:12px;white-space:pre-line;animation:pop 320ms cubic-bezier(.22,1,.36,1)}
.msg time{display:block;text-align:right;font-size:.68rem;color:#8696a0;margin-top:2px}
.msg.bot{align-self:flex-start;background:#202c33;border-top-left-radius:4px}
.msg.me{align-self:flex-end;background:#005c4b;border-top-right-radius:4px;transform-origin:bottom right}
.typing{align-self:flex-start;display:flex;gap:4px;padding:12px 14px;border-radius:12px;background:#202c33}
.typing span{width:6px;height:6px;border-radius:50%;background:#8696a0;animation:dot 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes dot{40%{opacity:1;transform:translateY(-3px)}0%,80%,100%{opacity:.35}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
.quick{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px 10px}
.quick button{border:1px solid #2a3942;background:#111b21;color:#53bdeb;padding:9px 14px;border-radius:999px;font:600 14px ui-sans-serif,system-ui,sans-serif;cursor:pointer;touch-action:manipulation}
.quick button:active{transform:scale(.96)}
form{display:flex;gap:8px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:#1f2c34}
input{flex:1;min-width:0;font:16px ui-sans-serif,system-ui,sans-serif;padding:12px 14px;border-radius:999px;border:0;background:#2a3942;color:#e9edef}
input:focus{outline:2px solid #00a884}
form button{width:48px;height:48px;border-radius:50%;border:0;background:#00a884;color:#fff;cursor:pointer;flex:none}
.hint{text-align:center;font-size:.78rem;color:#8696a0;padding:8px 16px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="demo-bar"><span><b>Exemplo fictício</b> <span class="hide-sm">· assistente virtual criado por Matheus Villanova</span></span><span class="links"><a class="back" href="/#exemplos">← Voltar</a><a href="https://wa.me/5511933010415?text=Ol%C3%A1%2C%20Matheus!%20Testei%20o%20assistente%20virtual%20de%20exemplo%20e%20quero%20um%20para%20o%20meu%20neg%C3%B3cio." target="_blank" rel="noopener">Quero um assim</a></span></div>
<div class="app">
  <div class="head"><i aria-hidden="true">🦷</i><div><b>Clínica Sorriso Leve</b><small id="status">online</small></div></div>
  <p class="hint">Simulação: no projeto real, o assistente usa inteligência artificial treinada com as informações do seu negócio e fica ligado à sua agenda.</p>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="quick" id="quick"></div>
  <form id="form"><label for="text" style="position:absolute;left:-9999px">Mensagem</label><input id="text" placeholder="Escreva uma mensagem" autocomplete="off"><button aria-label="Enviar"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg></button></form>
</div>
<script>
const log = document.getElementById('log'), quick = document.getElementById('quick'), status = document.getElementById('status');
const now = () => new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const PRICES = { 'Avaliação': 'grátis', 'Limpeza': 'R$ 180', 'Clareamento': 'R$ 790', 'Restauração': 'a partir de R$ 220' };
const state = { step: null, service: null, day: null };
function add(text, who) { const m = document.createElement('div'); m.className = `msg ${who}`; const safe = text.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])).replace(/\*(.+?)\*/g, '<b>$1</b>');
  m.innerHTML = `${safe}<time>${now()}</time>`; log.appendChild(m); log.scrollTop = log.scrollHeight; }
function options(list) { quick.innerHTML = list.map((o) => `<button type="button">${o}</button>`).join(''); }
function bot(text, opts = []) {
  quick.innerHTML = ''; status.textContent = 'digitando…';
  const t = document.createElement('div'); t.className = 'typing'; t.innerHTML = '<span></span><span></span><span></span>'; log.appendChild(t); log.scrollTop = log.scrollHeight;
  setTimeout(() => { t.remove(); status.textContent = 'online'; add(text, 'bot'); options(opts); }, 650 + Math.min(text.length * 8, 900));
}
const MAIN = ['Marcar consulta', 'Preços', 'Horários e endereço', 'Aceitam convênio?', 'Falar com uma pessoa'];
function handle(raw) {
  const text = raw.trim(); if (!text) return; add(text, 'me');
  const t = text.toLowerCase();
  if (state.step === 'service' && PRICES[text]) { state.service = text; state.step = 'day'; return bot(`Ótimo, ${text.toLowerCase()}! Para qual dia?`, ['Amanhã', 'Quinta-feira', 'Sexta-feira', 'Sábado']); }
  if (state.step === 'day') { state.day = text; state.step = 'time'; return bot(`Para ${text.toLowerCase()} tenho estes horários livres:`, ['9h00', '10h30', '14h00', '16h30']); }
  if (state.step === 'time' && /\d+h/.test(t)) { state.time = text; state.step = 'name'; return bot('Perfeito! Qual o seu nome completo?'); }
  if (state.step === 'name') { state.step = null; return bot(`Prontinho, ${text.split(' ')[0]}! ✅\n\n*${state.service}*\n${state.day}, às ${state.time}\nClínica Sorriso Leve – Rua Exemplo, 45\n\nVou te mandar um lembrete um dia antes. Se precisar remarcar, é só me chamar por aqui.`, ['Preços', 'Horários e endereço', 'Recomeçar']); }
  if (/marc|agend|consulta|horário livre/.test(t)) { state.step = 'service'; return bot('Claro! Qual atendimento você precisa?', Object.keys(PRICES)); }
  if (/preç|valor|quanto|custa/.test(t)) return bot(`Nossos valores:\n${Object.entries(PRICES).map(([k, v]) => `• ${k}: ${v}`).join('\n')}\n\nParcelamos em até 6x sem juros.`, ['Marcar consulta', 'Aceitam convênio?']);
  if (/hor|endere|onde|fica|abre|fecha/.test(t)) return bot('Atendemos de segunda a sexta, das 8h às 19h, e sábado das 8h às 13h.\n📍 Rua Exemplo, 45 – Vila Mariana, São Paulo.', ['Marcar consulta', 'Preços']);
  if (/conv|plano|unimed|amil|sulam/.test(t)) return bot('Atendemos os principais convênios odontológicos. Me diga qual é o seu que eu confirmo a cobertura antes da consulta.', ['Marcar consulta', 'Falar com uma pessoa']);
  if (/pessoa|humano|atendente|falar com/.test(t)) return bot('Sem problema! Vou chamar a nossa recepção, que responde em alguns minutos no horário de atendimento. 😊', ['Recomeçar']);
  if (/recome|oi|olá|ola|bom dia|boa tarde|boa noite/.test(t)) { state.step = null; return bot('Olá! Sou o assistente virtual da Clínica Sorriso Leve. Como posso te ajudar?', MAIN); }
  return bot('Não entendi muito bem, mas posso te ajudar com estas opções:', MAIN);
}
quick.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) handle(b.textContent); });
document.getElementById('form').addEventListener('submit', (e) => { e.preventDefault(); const i = document.getElementById('text'); handle(i.value); i.value = ''; });
bot('Olá! 👋 Sou o assistente virtual da Clínica Sorriso Leve. Posso marcar sua consulta, passar preços e tirar dúvidas, a qualquer hora.', MAIN);
</script>
</body>
</html>
